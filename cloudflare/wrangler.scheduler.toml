# Hup Up Attractions free scheduler (Cloudflare Workers free plan). Deploy:
#   npx wrangler deploy --config cloudflare/wrangler.scheduler.toml
#   npx wrangler secret put CRON_SECRET --config cloudflare/wrangler.scheduler.toml
# Needs a Cloudflare API token limited to Workers. No R2, no DNS, no routes on the domain.
name = "hupup-scheduler"
main = "scheduler-worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
# Every 5 minutes (Abraham, Nov 27, 2026, 2:14-2:22 AM ET, f1b08df): the live build sets this same schedule
# (scripts/deploy-setup.ts); the site does the 3-hourly jobs every 3 hours and wakes sooner only for held texts and
# address re-checks (small R2 flags). Deep check 06:00 M60: this file said every 3 hours, so a manual deploy with it
# would have delayed held texts and address re-checks by up to 3 hours.
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://hupupattractions.com"
